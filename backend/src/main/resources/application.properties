# Server Configuration
server.port=8080
server.servlet.context-path=/api/v1

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://[REDACTED_USER]:[REDACTED_PASSWORD]@localhost:27017/it_career_partner?retryWrites=true&w=majority}
spring.data.mongodb.database=it_career_partner

# Session & Cookie Security
server.servlet.session.timeout=7d
server.servlet.session.cookie.name=IT_PARTNER_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Resume File Storage
storage.resume.local-dir=./storage/resumes
storage.resume.max-file-size-mb=5

# Async Task Execution
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100

# CORS Allowed Origins
cors.allowed-origins=http://localhost:5173,http://localhost:4173,http://localhost:3000
