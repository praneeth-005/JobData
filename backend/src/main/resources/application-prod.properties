# ==============================================================================
# Production Profile Configuration ('prod')
# ==============================================================================
# Strictly requires an externally configured MONGODB_URI environment variable.
# Spring Boot fails fast if MONGODB_URI is missing or unset.
# NEVER silently falls back to localhost, test, or development credentials.
# ==============================================================================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:it_career_partner}

# Enforce secure cookie settings in production
server.servlet.session.cookie.secure=true
