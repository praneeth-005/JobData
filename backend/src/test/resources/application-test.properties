# ==============================================================================
# Isolated Test Configuration
# Automated tests NEVER connect to production or external cloud databases.
# ==============================================================================
spring.profiles.active=test
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/it_career_partner_test
spring.data.mongodb.database=it_career_partner_test

# Fast fail timeouts for test environment (prevents blocking if daemon is absent)
spring.data.mongodb.connection-timeout=500
spring.data.mongodb.server-selection-timeout=500

# Server settings
server.port=-1
server.servlet.context-path=/api/v1

# Security & Sessions
server.servlet.session.timeout=1h
server.servlet.session.cookie.name=IT_PARTNER_TEST_SESSION

# Private Test Storage
storage.resume.local-dir=./target/test-storage/resumes
storage.resume.max-file-size-mb=5

# CORS Allowed Origins
cors.allowed-origins=http://localhost:5173
